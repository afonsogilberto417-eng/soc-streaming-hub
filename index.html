  <body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Block dev tools shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12') { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) { e.preventDefault(); return false; }
        if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) { e.preventDefault(); return false; }
        if (e.ctrlKey && (e.key === 'c' || e.key === 'C' || e.key === 'a' || e.key === 'A')) { e.preventDefault(); return false; }
        // Block Print Screen
        if (e.key === 'PrintScreen') { e.preventDefault(); return false; }
        // Block Ctrl+P (print)
        if (e.ctrlKey && (e.key === 'p' || e.key === 'P')) { e.preventDefault(); return false; }
      });
      document.addEventListener('copy', function(e) { e.preventDefault(); });
      document.addEventListener('cut', function(e) { e.preventDefault(); });
      // Anti-debugger (only in production)
      if (location.hostname !== 'localhost' && !location.hostname.includes('lovable')) {
        setInterval(function() { debugger; }, 1000);
      }
    </script>
  </body>
